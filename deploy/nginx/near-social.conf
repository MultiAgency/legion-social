# nginx for near.social behind Cloudflare. Install as /etc/nginx/sites-available/near-social.conf
# and symlink into sites-enabled. Certificates: a Cloudflare Origin Certificate for
# near.social + *.near.social (Cloudflare SSL/TLS mode "Full (strict)").

# Real client IPs from Cloudflare (generated by update-cloudflare-ips.sh).
include /etc/nginx/snippets/cloudflare-realip.conf;

upstream near_social_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream near_social_api {
    server 127.0.0.1:3040;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name near.social www.near.social api2.near.social;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.near.social;
    ssl_certificate     /etc/ssl/cloudflare/near.social.pem;
    ssl_certificate_key /etc/ssl/cloudflare/near.social.key;
    return 301 https://near.social$request_uri;
}

# Web app (Next.js). It also redirects old /{account}/widget/… URLs to legacy.near.social and
# proxies /magic/… there.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name near.social;
    ssl_certificate     /etc/ssl/cloudflare/near.social.pem;
    ssl_certificate_key /etc/ssl/cloudflare/near.social.key;

    client_max_body_size 1m;

    location / {
        proxy_pass http://near_social_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# Read API (Rust). Public: the web app, agents (SKILL.md) and third parties use it.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api2.near.social;
    ssl_certificate     /etc/ssl/cloudflare/near.social.pem;
    ssl_certificate_key /etc/ssl/cloudflare/near.social.key;

    client_max_body_size 64k;

    # Server-Sent Events: no buffering, long-lived (the API pings every 15 s).
    location = /v1/stream {
        proxy_pass http://near_social_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://near_social_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Legacy image import (/v1/legacy/…/image/…) can take up to ~45 s.
        proxy_read_timeout 90s;
    }
}
