[package]
name = "near-social-server"
description = "Indexer + read API for near.social on FastData KV (social-kv/1)"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
tracing-actix-web = "0.7.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15.0"
tracing = { version = "0.1.13", features = ["log"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
fastnear-primitives = "=0.38.0-rc.2"
fastnear-neardata-fetcher = "=0.38.0-rc.2"
reqwest = { version = "0.12.2", default-features = false, features = ["json", "rustls-tls", "stream"] }
anyhow = "1.0.70"
futures = "0.3.31"
parking_lot = "0.12"
rustc-hash = "2"
regex = "1"
base64 = "0.22"
url = "2"
bytes = "1"
